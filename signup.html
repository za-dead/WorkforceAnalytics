<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workforce Analytics - Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        button:hover { background-color: #0056b3; }
        a { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>New Employee Signup</h2>
        <form action="http://localhost:8080/api/signup" method="POST">
            <input type="text" name="firstName" required placeholder="First Name">
            <input type="text" name="lastName" required placeholder="Last Name">
            <input type="email" name="email" required placeholder="Email Address">
            <input type="password" name="password" required placeholder="Create Password">
            <input type="text" name="role" required placeholder="Job Role (e.g., Developer)">
            <input type="number" name="departmentId" required placeholder="Dept ID (1-5)">
            
            <button type="submit">Create Account</button>
        </form>
        <!-- adding a link back to login.. acts as a logout flow -->
        <a href="index.html">Already have an account? Log In</a>
    </div>

</body>
</html>
